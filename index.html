
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتحف الرقمي | Digital Museum</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#111820;
  color:#f5eee2;
}
header{
  text-align:center;
  padding:55px 20px 35px;
  background:linear-gradient(135deg,#182b35,#10151c);
  border-bottom:2px solid #b89555;
}
header h1{color:#d8b875;font-size:34px;margin:0 0 12px}
header p{color:#d4c8b4;line-height:1.9}
.search{
  display:block;
  width:min(90%,500px);
  margin:25px auto;
  padding:14px;
  border:1px solid #b89555;
  border-radius:25px;
  background:#202a33;
  color:white;
  font-size:16px;
  text-align:center;
}
.container{
  width:min(1150px,94%);
  margin:35px auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:25px;
}
.card{
  background:#202a33;
  border:1px solid #75613f;
  border-radius:15px;
  overflow:hidden;
  transition:.3s;
}
.card:hover{transform:translateY(-5px);border-color:#d8b875}
.card img{
  width:100%;
  height:220px;
  object-fit:cover;
  background:#303942;
  display:block;
}
.card-content{padding:18px}
.card h2{color:#e0c184;font-size:20px;margin:0 0 8px}
.english{color:#b8b1a4;font-size:14px;direction:ltr;text-align:right}
.card p{line-height:1.8;color:#e2ddd4}
button{
  background:#b89555;
  color:#15191d;
  border:0;
  border-radius:20px;
  padding:10px 22px;
  cursor:pointer;
  font-weight:bold;
}
.details{
  display:none;
  padding:12px 0;
  line-height:2;
  color:#e5d8c1;
}
.details.open{display:block}
footer{
  text-align:center;
  padding:30px;
  margin-top:40px;
  color:#b9a77f;
  border-top:1px solid #75613f;
}
.status{
  text-align:center;
  color:#d8b875;
  padding:10px;
  line-height:1.8;
}
</style>
</head>

<body>

<header>
  <h1>المتحف الرقمي</h1>
  <h2>Digital Museum</h2>
  <p>رحلة عبر تاريخ حضارات بلاد الرافدين وآثارها الخالدة</p>
</header>

<input
  class="search"
  id="search"
  type="text"
  placeholder="ابحثي عن قطعة أثرية..."
  oninput="searchArtifacts()"
>

<div class="status" id="status">جاري تحميل صور القطع الأثرية...</div>

<main class="container" id="museum"></main>

<footer>
  المتحف الرقمي — Digital Museum
  <br>
  رحلة إلى حضارة بلاد الرافدين
</footer>

<script>
const OWNER = "aalaaosama19991011-history";
const REPO = "digital-museum";

/* بيانات القطع الأثرية */
const artifacts = [
{
 name:"إناء الوركاء",
 english:"Warka Vase",
 date:"نحو 3200–3000 ق.م",
 place:"مدينة الوركاء، جنوب العراق",
 material:"المرمر",
 file:["warkavase"],
 description:"يُعد إناء الوركاء من أقدم الأعمال الفنية السردية المعروفة. يتكون من عدة مستويات زخرفية تصور مشاهد من الطبيعة والعبادة وتقديم القرابين، وتنتهي بمشهد تقديم الهدايا إلى الإلهة إنانا.",
 importance:"يكشف الإناء عن تطور الفن والنحت والتفكير الديني والتنظيم الاجتماعي في حضارة بلاد الرافدين."
},
{
 name:"قيثارة أور",
 english:"Lyre of Ur",
 date:"نحو 2550–2450 ق.م",
 place:"المقبرة الملكية في أور، العراق",
 material:"الخشب والذهب والفضة واللازورد والصدف",
 file:["lyreofur"],
 description:"آلة موسيقية وترية عُثر عليها في المقبرة الملكية بمدينة أور. زُينت بمكونات ثمينة، واحتوت واجهتها على زخارف ومشاهد حيوانية أسطورية.",
 importance:"توضح مدى تقدم الموسيقى والصناعات الفنية واستخدام المواد الثمينة في المجتمع السومري."
},
{
 name:"رأس الملك الأكدي",
 english:"Akkadian Head",
 date:"نحو 2250 ق.م",
 place:"مدينة نينوى، العراق",
 material:"البرونز",
 file:["akkadianhead"],
 description:"رأس نحتي ملكي يتميز بالتفاصيل الدقيقة للشعر واللحية والملامح. تعرض الجزء العلوي منه للتلف والتشويه المتعمد في العصور القديمة.",
 importance:"يُعد مثالًا بارزًا على مهارة النحاتين في العصر الأكدي وعلى تصوير السلطة الملكية."
},
{
 name:"مسلة شريعة حمورابي",
 english:"Code of Hammurabi",
 date:"نحو 1754 ق.م",
 place:"بابل، العراق؛ عُثر عليها في سوسة",
 material:"حجر الديوريت",
 file:["codeofhammurabi"],
 description:"مسلة حجرية ضخمة تحمل مجموعة من القوانين التي أصدرها الملك حمورابي. يظهر في أعلاها الملك واقفًا أمام الإله شمش.",
 importance:"تُعد من أشهر الوثائق القانونية القديمة، وتقدم معلومات عن القضاء والعقوبات والحياة الاجتماعية في بابل."
},
{
 name:"نقش البيستون",
 english:"Behistun Inscription",
 date:"القرن السادس ق.م",
 place:"جبل بيستون، إيران",
 material:"نقش على الصخر",
 file:["behistuninscription","behistun"],
 description:"نقش ملكي ضخم أمر به الملك الفارسي داريوس الأول. كُتب بثلاث لغات قديمة: الفارسية القديمة والعيلامية والبابلية.",
 importance:"كان له دور أساسي في فك رموز الكتابة المسمارية وفهم تاريخ الإمبراطورية الأخمينية."
},
{
 name:"بوابة عشتار",
 english:"Ishtar Gate",
 date:"نحو 575 ق.م",
 place:"مدينة بابل، العراق",
 material:"الطوب المزجج",
 file:["ishtargate"],
 description:"بوابة ضخمة كانت جزءًا من أسوار مدينة بابل. زُينت بالطوب الأزرق اللامع وصور الثيران والتنانين والرموز المرتبطة بالآلهة.",
 importance:"تُظهر عظمة العمارة البابلية وتقدم تقنيات البناء والزخرفة باستخدام الطوب المزجج."
},
{
 name:"زقورة أور",
 english:"Ziggurat of Ur",
 date:"نحو القرن الحادي والعشرين ق.م",
 place:"مدينة أور، جنوب العراق",
 material:"الطوب اللبن والطوب المفخور",
 file:["zigguratofur","ziggurat","urziggurat"],
 description:"معبد مدرج ضخم بناه الملك أور نمو في مدينة أور. يتكون من طبقات متدرجة وسلالم تؤدي إلى الجزء العلوي.",
 importance:"تمثل الزقورة أحد أبرز نماذج العمارة الدينية السومرية، وتعكس التنظيم الهندسي والقدرة الإنشائية."
},
{
 name:"تماثيل تل أسمر النذرية",
 english:"Tell Asmar Votive Statues",
 date:"نحو 2900–2600 ق.م",
 place:"معبد أبو في تل أسمر، العراق",
 material:"الجبس والحجر الجيري والألباستر",
 file:[
   "tellasmarvotivesstatues",
   "tellasmarvotives",
   "tellasmar",
   "tellasmartemples",
   "votivesstatues"
 ],
 description:"مجموعة من التماثيل البشرية عُثر عليها داخل معبد أبو في تل أسمر. تتميز بعيون كبيرة وواسعة وأيدٍ متشابكة، وصُنعت بأحجام مختلفة.",
 importance:"تمثل هذه التماثيل أشخاصًا يقدمون أنفسهم نذورًا للآلهة، وكانت العيون الواسعة رمزًا للانتباه الدائم والعبادة."
},
{
 name:"لوحة نذرية لحكام بلاد الرافدين",
 english:"Votive Plaque of Mesopotamian Rulers",
 date:"الألفية الثالثة ق.م",
 place:"بلاد الرافدين",
 material:"الحجر",
 file:["votiveplaqueofmesopotamianrulers","votiveplaque"],
 description:"لوحة أثرية نذرية تحمل مشاهد وشخصيات مرتبطة بالممارسات الدينية والملكية في بلاد الرافدين.",
 importance:"تساعد اللوحات النذرية على فهم الطقوس الدينية والعلاقة بين الحكام والمعابد."
},
{
 name:"مسلة النسور",
 english:"Stele of the Vultures",
 date:"نحو 2450 ق.م",
 place:"مدينة لكش، العراق",
 material:"الحجر الجيري",
 file:["steleofthevultures","vultures"],
 description:"مسلة تاريخية أمر بها الملك إياناتوم ملك لكش لتخليد انتصاره في صراعه مع مدينة أوما. تحمل نقوشًا تصور مشاهد المعارك والجنود والرموز الدينية.",
 importance:"تُعد من أقدم الشواهد المصورة على الحروب والصراعات السياسية في تاريخ بلاد الرافدين."
}
];

/* إزالة المسافات والنقاط والرموز من أسماء الملفات */
function normalize(value){
 return value
  .toLowerCase()
  .replace(/[^a-z0-9]/g,"");
}

/* تحميل الصور من ملفات المستودع */
async function loadPhotos(){
 const status = document.getElementById("status");

 try{
  const response = await fetch(
   `https://api.github.com/repos/${OWNER}/${REPO}/contents/`
  );

  if(!response.ok){
   throw new Error("تعذر الوصول إلى ملفات المستودع");
  }

  const files = await response.json();

  const images = files.filter(file =>
   file.type === "file" &&
   /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)
  );

  artifacts.forEach(artifact => {
   const aliases = artifact.file.map(normalize);

   let match = images.find(file => {
    const filename = normalize(file.name);

    return aliases.some(alias =>
     filename.includes(alias) || alias.includes(filename.replace(/(jpg|jpeg|png|webp|gif)$/,""))
    );
   });

   /* بحث إضافي مرن عن تماثيل تل أسمر */
   if(!match && artifact.english === "Tell Asmar Votive Statues"){
    match = images.find(file => {
     const filename = normalize(file.name);
     return filename.includes("tellasmar") ||
            (filename.includes("votive") && filename.includes("statue"));
    });
   }

   artifact.image = match ? match.download_url : "";
  });

  renderArtifacts();

  const missing = artifacts.filter(a => !a.image);

  if(missing.length){
   status.textContent =
    "تم تحميل الموقع. لم يتم العثور على صور: " +
    missing.map(a => a.name).join("، ");
  }else{
   status.textContent = "تم تحميل صور القطع الأثرية بنجاح.";
  }

 }catch(error){
  status.textContent =
   "تعذر تحميل الصور تلقائيًا. تأكدي من أن المستودع عام وأن الصور موجودة في الصفحة الرئيسية للمستودع.";
  renderArtifacts();
 }
}

/* عرض القطع */
function renderArtifacts(){
 const museum = document.getElementById("museum");

 museum.innerHTML = artifacts.map((a,index) => `
  <article class="card" data-name="${a.name} ${a.english}">
   ${
    a.image
    ? `<img src="${a.image}" alt="${a.name}" loading="lazy">`
    : `<div style="height:220px;display:grid;place-items:center;color:#c9ad75;background:#303942">الصورة غير موجودة</div>`
   }

   <div class="card-content">
    <h2>${a.name}</h2>
    <div class="english">${a.english}</div>

    <p>${a.description}</p>

    <button onclick="toggleDetails(${index})">عرض التفاصيل</button>

    <div class="details" id="details-${index}">
     <strong>التاريخ:</strong> ${a.date}<br>
     <strong>مكان العثور:</strong> ${a.place}<br>
     <strong>المادة:</strong> ${a.material}<br>
     <strong>الأهمية التاريخية:</strong> ${a.importance}
    </div>
   </div>
  </article>
 `).join("");
}

/* إظهار التفاصيل */
function toggleDetails(index){
 const details = document.getElementById("details-" + index);
 details.classList.toggle("open");
}

/* البحث */
function searchArtifacts(){
 const value = document.getElementById("search").value
  .trim()
  .toLowerCase();

 document.querySelectorAll(".card").forEach(card => {
  card.style.display =
   card.dataset.name.toLowerCase().includes(value)
   ? "block"
   : "none";
 });
}

loadPhotos();
</script>

</body>
</html>
