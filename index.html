
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المتحف الرقمي | Digital Museum</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#111820;color:#f5eee2}
header{text-align:center;padding:45px 15px;background:linear-gradient(135deg,#182b35,#10151c);border-bottom:2px solid #b89555}
h1{color:#d8b875;font-size:32px;margin:0 0 10px}
header p{line-height:1.9;color:#d4c8b4}
.search{display:block;width:90%;max-width:500px;margin:25px auto;padding:14px;border:1px solid #b89555;border-radius:25px;background:#202a33;color:white;font-size:16px;text-align:center}
.container{width:94%;max-width:1150px;margin:30px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.card{background:#202a33;border:1px solid #75613f;border-radius:15px;overflow:hidden}
.card img{width:100%;height:220px;object-fit:cover;display:block;background:#303942}
.content{padding:18px}
h2{font-size:20px;color:#e0c184;margin:0 0 8px}
.english{direction:ltr;text-align:right;color:#b8b1a4;font-size:14px}
p{line-height:1.9}
button{background:#b89555;color:#15191d;border:0;border-radius:20px;padding:10px 22px;font-weight:bold;cursor:pointer}
.details{display:none;line-height:2;color:#e5d8c1;padding-top:12px}
.details.open{display:block}
.status{text-align:center;color:#d8b875;padding:12px}
footer{text-align:center;padding:30px;color:#b9a77f;border-top:1px solid #75613f;margin-top:35px}
</style>
</head>
<body>

<header>
<h1>المتحف الرقمي</h1>
<h2>Digital Museum</h2>
<p>رحلة عبر تاريخ حضارات بلاد الرافدين وآثارها الخالدة</p>
</header>

<input class="search" id="search" placeholder="ابحثي عن قطعة أثرية..." oninput="searchArtifacts()">
<div class="status" id="status">صور المتحف مرتبطة مباشرة بملفات المستودع.</div>
<main class="container" id="museum"></main>

<footer>المتحف الرقمي — Digital Museum<br>رحلة إلى حضارة بلاد الرافدين</footer>

<script>
const BASE="https://raw.githubusercontent.com/aalaaosama19991011-history/digital-museum/main/";

const artifacts=[
{
name:"إناء الوركاء",
english:"Warka Vase",
file:"warkavase.jpg.png",
date:"نحو 3200–3000 ق.م",
place:"مدينة الوركاء، جنوب العراق",
material:"المرمر",
description:"من أقدم الأعمال الفنية السردية المعروفة. يتكون من مستويات زخرفية تصور مشاهد من الطبيعة والعبادة وتقديم القرابين للإلهة إنانا.",
importance:"يكشف عن تطور الفن والنحت والتفكير الديني والتنظيم الاجتماعي في حضارة بلاد الرافدين."
},
{
name:"قيثارة أور",
english:"Lyre of Ur",
file:"lyreofur.jpg.png",
date:"نحو 2550–2450 ق.م",
place:"المقبرة الملكية في أور، العراق",
material:"الخشب والذهب والفضة واللازورد والصدف",
description:"آلة موسيقية وترية عُثر عليها في المقبرة الملكية بمدينة أور، وزُينت بمواد ثمينة ومشاهد حيوانية.",
importance:"توضح تقدم الموسيقى والصناعات الفنية واستخدام المواد الثمينة في المجتمع السومري."
},
{
name:"رأس الملك الأكدي",
english:"Akkadian Head",
file:"akkadianhead.jpg.png",
date:"نحو 2250 ق.م",
place:"مدينة نينوى، العراق",
material:"البرونز",
description:"رأس نحتي ملكي يتميز بالتفاصيل الدقيقة للشعر واللحية والملامح، وقد تعرض للتشويه في العصور القديمة.",
importance:"مثال بارز على مهارة النحاتين في العصر الأكدي وتصوير السلطة الملكية."
},
{
name:"مسلة شريعة حمورابي",
english:"Code of Hammurabi",
file:"codeofhammurabi.jpg.png",
date:"نحو 1754 ق.م",
place:"بابل، العراق؛ عُثر عليها في سوسة",
material:"حجر الديوريت",
description:"مسلة حجرية تحمل مجموعة من القوانين التي أصدرها الملك حمورابي، ويظهر في أعلاها أمام الإله شمش.",
importance:"من أشهر الوثائق القانونية القديمة، وتقدم معلومات عن القضاء والعقوبات والحياة الاجتماعية في بابل."
},
{
name:"نقش البيستون",
english:"Behistun Inscription",
file:"behistuninscription.jpg.png",
date:"القرن السادس ق.م",
place:"جبل بيستون، إيران",
material:"نقش صخري",
description:"نقش ملكي أمر به داريوس الأول، وكُتب بثلاث لغات قديمة هي الفارسية القديمة والعيلامية والبابلية.",
importance:"ساعد في فك رموز الكتابة المسمارية وفهم تاريخ الإمبراطورية الأخمينية."
},
{
name:"بوابة عشتار",
english:"Ishtar Gate",
file:"ishtargate.jpg.png",
date:"نحو 575 ق.م",
place:"مدينة بابل، العراق",
material:"الطوب المزجج",
description:"بوابة ضخمة كانت جزءًا من أسوار بابل، وزُينت بالطوب الأزرق اللامع وصور الثيران والتنانين.",
importance:"تُظهر عظمة العمارة البابلية وتقدم تقنيات البناء والزخرفة بالطوب المزجج."
},
{
name:"زقورة أور",
english:"Ziggurat of Ur",
file:"zigguratofur.jpg.png",
date:"نحو القرن الحادي والعشرين ق.م",
place:"مدينة أور، جنوب العراق",
material:"الطوب اللبن والطوب المفخور",
description:"معبد مدرج ضخم بناه الملك أور نمو، ويتكون من طبقات متدرجة وسلالم تؤدي إلى الجزء العلوي.",
importance:"من أبرز نماذج العمارة الدينية السومرية، وتعكس التنظيم الهندسي والقدرة الإنشائية."
},
{
name:"تماثيل تل أسمر النذرية",
english:"Tell Asmar Votive Statues",
file:"tellasmarvotivestatues.jpg.png",
date:"نحو 2900–2600 ق.م",
place:"معبد أبو في تل أسمر، العراق",
material:"الجبس والحجر الجيري والألباستر",
description:"مجموعة من التماثيل البشرية عُثر عليها داخل معبد أبو في تل أسمر. تتميز بعيون كبيرة وواسعة وأيدٍ متشابكة، وصُنعت بأحجام مختلفة.",
importance:"تمثل أشخاصًا يقدمون أنفسهم نذورًا للآلهة، وكانت العيون الواسعة رمزًا للانتباه الدائم والعبادة."
},
{
name:"لوحة نذرية لحكام بلاد الرافدين",
english:"Votive Plaque of Mesopotamian Rulers",
file:"votiveplaqueofmesopotamianrulers.jpg.png",
date:"الألفية الثالثة ق.م",
place:"بلاد الرافدين",
material:"الحجر",
description:"لوحة أثرية نذرية تحمل مشاهد وشخصيات مرتبطة بالممارسات الدينية والملكية في بلاد الرافدين.",
importance:"تساعد اللوحات النذرية على فهم الطقوس الدينية والعلاقة بين الحكام والمعابد."
},
{
name:"مسلة النسور",
english:"Stele of the Vultures",
file:"steleofthevultures.jpg.png",
date:"نحو 2450 ق.م",
place:"مدينة لكش، العراق",
material:"الحجر الجيري",
description:"مسلة أمر بها الملك إياناتوم ملك لكش لتخليد انتصاره في صراعه مع مدينة أوما، وتحمل مشاهد للمعارك والجنود.",
importance:"من أقدم الشواهد المصورة على الحروب والصراعات السياسية في تاريخ بلاد الرافدين."
}
];

function renderArtifacts(){
const museum=document.getElementById("museum");
museum.innerHTML=artifacts.map((a,i)=>`
<article class="card" data-name="${a.name} ${a.english}">
<img src="${BASE+a.file}" alt="${a.name}" loading="lazy"
onerror="this.style.display='none';this.nextElementSibling.textContent='تعذر تحميل الصورة: ${a.file}'">
<div class="content">
<h2>${a.name}</h2>
<div class="english">${a.english}</div>
<p>${a.description}</p>
<button onclick="toggleDetails(${i})">عرض التفاصيل</button>
<div class="details" id="details-${i}">
<strong>التاريخ:</strong> ${a.date}<br>
<strong>مكان العثور:</strong> ${a.place}<br>
<strong>المادة:</strong> ${a.material}<br>
<strong>الأهمية التاريخية:</strong> ${a.importance}
</div>
</div>
</article>
`).join("");
}

function toggleDetails(i){
document.getElementById("details-"+i).classList.toggle("open");
}

function searchArtifacts(){
const value=document.getElementById("search").value.toLowerCase().trim();
document.querySelectorAll(".card").forEach(card=>{
card.style.display=card.dataset.name.toLowerCase().includes(value)?"block":"none";
});
}

renderArtifacts();
</script>
</body>
</html>
