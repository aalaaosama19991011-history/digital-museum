<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;

  color:#f5eee2;
}
header{

header h2{color:#eee0c4}
header p{color:#d4c8b4;line-height:1.9}
.search{

  max-width:500px;

  border-radius:25px;

  font-size:16px;

}

}
.image-error{

  padding:15px;
  text-align:center;
  color:#e0c184;
  background:#303942;
  direction:ltr;

}
.content{padding:20px}
.card h2{color:#e0c184;font-size:21px;margin:0 0 8px}
.english{

  font-size:14px;
  direction:ltr;
  text-align:right;
  margin-bottom:15px;
}
.card p{line-height:1.9;color:#e2ddd4}
.info{
  line-height:2;
  color:#e5d8c1;
  overflow-wrap:anywhere;
}
.info strong{color:#d8b875}
.details{

  padding-top:12px;
  border-top:1px solid #75613f;
  margin-top:15px;
}
.details.open{display:block}
.references{

}
.references div{margin:5px 0;direction:ltr;text-align:left}
button{

  border:0;
  border-radius:20px;

footer{

  padding:30px;
  margin-top:40px;
  color:#b9a77f;
  border-top:1px solid #75613f;
  line-height:2;

</style>
</head>

/* عرض البيانات والمراجع كما وردت */
function renderArtifacts(){
 const museum=document.getElementById("museum");

 museum.innerHTML=artifacts.map((a,index)=>`
  <article class="card" data-name="${a.name} ${a.english}">
   <div class="image-area" id="image-area-${index}">
    <div class="image-error">جاري البحث عن الصورة...</div>
   </div>

   <div class="content">
    <h2>${a.name}</h2>
    <div class="english">${a.english}</div>

    <div class="info">
     <p><strong>التاريخ:</strong> ${a.date}</p>
     <p><strong>المكان:</strong> ${a.place}</p>
     <p><strong>المادة:</strong> ${a.material}</p>
     <p><strong>الأهمية:</strong> ${a.importance}</p>
    </div>

    <button onclick="toggleDetails(${index})">المعلومة المميزة والمراجع</button>

    <div class="details" id="details-${index}">
     <p><strong>معلومة مميزة:</strong> ${a.special}</p>
     <div class="references">
      <strong>المراجع من الكتب:</strong>
      ${a.references.map(ref=>`<div>${ref}</div>`).join("")}
     </div>
    </div>
   </div>
  </article>
 `).join("");
}

/* البحث في ملفات GitHub بأسماء مرنة */
async function loadPhotos(){
 const status=document.getElementById("status");

 try{
  const response=await fetch(
   `https://api.github.com/repos/${OWNER}/${REPO}/contents/`
  );

  if(!response.ok){
   throw new Error("تعذر الوصول إلى ملفات المستودع");
  }

  const files=await response.json();

  /* لا نستبعد الملفات بسبب المسافات أو النقاط في الامتداد */
  const allFiles=files.filter(file=>file.type==="file");

  artifacts.forEach((artifact,index)=>{
   const aliases=artifact.file.map(normalize);

   let match=allFiles.find(file=>{
    const filename=normalize(file.name);

    return aliases.some(alias=>
     filename.includes(alias)
    );
   });

   /* معالجة خاصة لاسم صورة تماثيل تل أسمر */
   if(index===7 && !match){
    match=allFiles.find(file=>{
     const filename=normalize(file.name);
     return filename.includes("tellasmar") &&
            filename.includes("statues");
    });
   }

   const area=document.getElementById("image-area-"+index);

   if(match){
    const img=document.createElement("img");
    img.src=match.download_url;
    img.alt=artifact.name;
    img.loading="lazy";

    img.onerror=()=>{
     area.innerHTML=
      `<div class="image-error">تعذر فتح الصورة:<br>${match.name}</div>`;
    };

    area.innerHTML="";
    area.appendChild(img);
   }else{
    area.innerHTML=
     `<div class="image-error">لم يتم العثور على صورة هذه القطعة في المستودع</div>`;
   }
  });

  const tellImage=document.querySelector("#image-area-7 img");

  status.textContent=tellImage
   ? "تم البحث عن الصور وتحميل الصور المتاحة."
   : "لم يتم العثور على صورة تماثيل تل أسمر. راجعي اسم الملف الظاهر في قائمة ملفات GitHub.";

 }catch(error){
  status.textContent=
   "تعذر تحميل الصور من GitHub. تأكدي من أن المستودع عام.";
 }
}

function toggleDetails(index){
 document.getElementById("details-"+index).classList.toggle("open");
}

function searchArtifacts(){
 const value=document.getElementById("search").value.trim().toLowerCase();

 document.querySelectorAll(".card").forEach(card=>{
  card.style.display=
   card.dataset.name.toLowerCase().includes(value)?"block":"none";
 });
}

renderArtifacts();
loadPhotos();
</script>
